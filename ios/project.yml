# XcodeGen-Beschreibung von UntPlan Next (Alternative zum mitgelieferten Xcode-Projekt, das Ordner synchronisiert).
# Erzeugen: im Ordner ios/ "xcodegen generate" ausführen (überschreibt ios/UntPlanNext.xcodeproj).
# Übersetzen nur mit Xcode 26 (iOS-26-SDK für Liquid Glass); Zielsystem iOS 18.
name: UntPlanNext
options:
  bundleIdPrefix: de.untplan
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SDKROOT: iphoneos
targets:
  UntPlanNext:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Der ganze Ordner ios/UntPlanNext (Swift-Dateien und Assets.xcassets); ios/Info.plist liegt daneben und wird über
      # INFOPLIST_FILE eingebunden
      - path: UntPlanNext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.untplan.next
        PRODUCT_NAME: UntPlanNext
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        # Ergänzt die generierte Info.plist: URL-Schema „untplannext“, Hintergrund-Aktualisierung (fetch,
        # remote-notification), BGTaskSchedulerPermittedIdentifiers (de.untplan.next.planpruefung), Kamera
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: UntPlan Next
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
