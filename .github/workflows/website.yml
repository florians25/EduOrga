name: EduOrga Website

# Eigener Ablauf für die Produkt-Website (Ordner website/, Image untplannext-website). Die Website gehört nicht zur
# Installation der Schulen; betrieben wird sie getrennt über installation/intern/ (nur für den Betreiber des Projekts). Commits mit [skip ci] bzw. [ci skip]
# im Text lösen keinen Lauf aus (GitHub überspringt sie von selbst); zusätzlich prüft jeder Job die Commit-Nachricht.
on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
    paths:
      - 'website/**'
      - 'design/**'
      - 'studio/docs/bilder/**'
      - 'web/docs/bilder/**'
      - 'mobile/docs/bilder/**'
      - 'ios/docs/bilder/**'
      - 'docs/HANDBUCH.md'
      - 'docs/bilder/druck/**'
      - 'VERSION'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/untplannext-website

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') && !contains(github.event.head_commit.message || '', '[ci skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/client/package-lock.json
      - name: Oberfläche bauen (Typprüfung + Vite)
        working-directory: website/client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests (Auslieferung der Seiten, Gesundheit, Betreiberangaben)
        run: dotnet test website/tests/EduOrgaWebsite.Tests -c Release

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Anmelden bei GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version bestimmen (Tag v1.2.3 → 1.2.3, sonst <VERSION>-dev.<Lauf>)
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "wert=$v" >> "$GITHUB_OUTPUT"
      - name: Stand für die Statusleiste (letzte Änderung, neueste Veröffentlichung)
        id: stand
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit_datum=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name + " " + .published_at' > release.txt 2>/dev/null; then
            echo "release=$(cut -d' ' -f1 release.txt)" >> "$GITHUB_OUTPUT"
            echo "release_datum=$(cut -d' ' -f2 release.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "release=-" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'claude/') }}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.version.outputs.wert }}
            type=sha,format=short
      - name: Image bauen (amd64 + arm64) und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.wert }}
            WEBSITE_COMMIT=${{ github.sha }}
            WEBSITE_COMMIT_DATUM=${{ steps.stand.outputs.commit_datum }}
            WEBSITE_RELEASE=${{ steps.stand.outputs.release }}
            WEBSITE_RELEASE_DATUM=${{ steps.stand.outputs.release_datum }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
