name: UntPlanWeb

# Eigener Ablauf für die Weboberfläche (Ordner web/). Der Desktop-Build (build.yml) bleibt davon unberührt.
on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
    paths:
      - 'web/**'
      - 'src/UntPlan.Web.Contracts/**'
      - 'src/UntPlan.Core/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'src/UntPlan.Web.Contracts/**'
      - 'src/UntPlan.Core/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/untplannext-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/client/package-lock.json
      - name: Oberfläche bauen (Typprüfung + Vite)
        working-directory: web/client
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test web/tests/UntPlanWeb.Tests -c Release

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Anmelden bei GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version bestimmen (Tag v1.2.3 → 1.2.3, sonst <VERSION>-dev.<Lauf>)
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "wert=$v" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'claude/') }}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.version.outputs.wert }}
            type=sha,format=short
      - name: Image bauen (amd64 + arm64) und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.wert }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
