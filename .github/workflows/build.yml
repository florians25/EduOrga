name: Build

# Fachlogik (src/UntPlan.Core) und Portal-Referenzserver. Die Oberflächen haben eigene Abläufe:
# studio.yml (UntPlan Studio), web.yml (UntPlan Web), mobile.yml (UntPlan Mobile).
on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/UntPlan.Core.Tests -c Release

      - name: Portal-Referenzserver veröffentlichen
        run: dotnet publish src/UntPlan.Portal -c Release -o artifacts/UntPlan.Portal

      - uses: actions/upload-artifact@v4
        with:
          name: UntPlan-Portal
          path: artifacts/UntPlan.Portal
