# UntPlan Next – Gesamtinstallation mit Docker
#
# Alle Namen (Projekt, Container, Dienste, Volumes, Images) tragen „next“ – eine bisherige UntPlan-Installation auf
# demselben Server läuft unabhängig weiter.
#
# Jedes Programm läuft in einem eigenen Container und hat seine eigenen Daten:
#   untplannext-studio      Planung im Browser       eigene Datenbank (SQLite im Volume untplannext-studio-daten oder MariaDB)
#   untplannext-web         Portal für die Schule    eigene Datenbank (SQLite im Volume untplannext-web-daten oder MariaDB)
#   untplannext-mobile      App fürs Telefon (PWA)   Geräteprofile im Volume untplannext-mobile-daten, Plandaten von Web
#   untplannext-mariadb     optional, für Web (Datenbank untplanweb) und/oder Studio (Datenbank eduorga_studio)
#   untplannext-caddy       optional, HTTPS mit automatischem Zertifikat
#   untplannext-watchtower  optional, Update aus der Administration von UntPlan Web
#
# Welche Container laufen, steht in .env unter COMPOSE_PROFILES (studio, web, mobile, mariadb, https, updater).
# Einrichtung:   ./install.sh          (fragt alles ab, schreibt .env und Caddyfile, startet die Container)
# Update:        ./update.sh           (sichert beide Datenbanken, lädt neue Images, startet neu)
#                ./update.sh studio    (nur ein Programm aktualisieren)
# Von Hand:      docker compose pull && docker compose up -d

name: untplannext

# Watchtower (Update aus der Administration von UntPlan Web) aktualisiert nur Web und Mobile;
# Studio wird unabhängig davon mit ./update.sh studio aktualisiert.
x-standard: &standard
  restart: unless-stopped
  labels:
    com.centurylinklabs.watchtower.enable: "true"
    # eigener Bereich: ein Watchtower des bisherigen UntPlan auf demselben Server fasst diese Container nicht an
    com.centurylinklabs.watchtower.scope: untplannext

services:
  untplannext-studio:
    restart: unless-stopped
    image: ghcr.io/florians25/untplannext-studio:${UNTPLAN_VERSION:-latest}
    container_name: untplannext-studio
    profiles: ["studio"]
    ports:
      - "${BIND_ADRESSE:-0.0.0.0}:${STUDIO_PORT:-8190}:8080"
    environment:
      TZ: ${ZEITZONE:-Europe/Berlin}
      STUDIO_ADMIN_BENUTZER: ${STUDIO_ADMIN_BENUTZER:-admin}
      STUDIO_ADMIN_PASSWORT: ${STUDIO_ADMIN_PASSWORT:-}
      STUDIO_SICHERE_COOKIES: ${STUDIO_SICHERE_COOKIES:-0}
      STUDIO_SICHERUNGEN_BEHALTEN: ${SICHERUNGEN_BEHALTEN:-14}
      # sqlite (Standard) oder mysql – bei mysql läuft der Container „untplannext-mariadb“ (Profil mariadb), Datenbank eduorga_studio
      STUDIO_DB: ${STUDIO_DB:-sqlite}
      STUDIO_DB_CONNECTION: ${STUDIO_DB_CONNECTION:-}
    volumes:
      - untplannext-studio-daten:/data

  untplannext-web:
    <<: *standard
    image: ghcr.io/florians25/untplannext-web:${UNTPLAN_VERSION:-latest}
    container_name: untplannext-web
    profiles: ["web"]
    ports:
      - "${BIND_ADRESSE:-0.0.0.0}:${WEB_PORT:-8180}:8080"
    environment:
      TZ: ${ZEITZONE:-Europe/Berlin}
      UNTPLANWEB_ZEITZONE: ${ZEITZONE:-Europe/Berlin}
      UNTPLANWEB_ADMIN_PASSWORT: ${UNTPLANWEB_ADMIN_PASSWORT:-}
      # sqlite (Standard) oder mysql – bei mysql läuft der Container „untplannext-mariadb“ (Profil mariadb)
      UNTPLANWEB_DB: ${UNTPLANWEB_DB:-sqlite}
      UNTPLANWEB_DB_CONNECTION: ${UNTPLANWEB_DB_CONNECTION:-}
      UNTPLANWEB_MOBILE_INTERN_URL: ${UNTPLANWEB_MOBILE_INTERN_URL:-}
      UNTPLANWEB_UPDATE_WATCHTOWER_URL: ${UNTPLANWEB_UPDATE_WATCHTOWER_URL:-}
      UNTPLANWEB_UPDATE_WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-}
    volumes:
      - untplannext-web-daten:/data

  untplannext-mobile:
    <<: *standard
    image: ghcr.io/florians25/untplannext-mobile:${UNTPLAN_VERSION:-latest}
    container_name: untplannext-mobile
    profiles: ["mobile"]
    ports:
      - "${BIND_ADRESSE:-0.0.0.0}:${MOBILE_PORT:-8181}:8081"
    environment:
      TZ: ${ZEITZONE:-Europe/Berlin}
      UNTPLANMOBILE_ZEITZONE: ${ZEITZONE:-Europe/Berlin}
      # UntPlan Web aus Sicht des Containers (Dienstname im Compose-Netz)
      UNTPLANWEB_URL: http://untplannext-web:8080
      UNTPLANMOBILE_VAPID_KONTAKT: ${UNTPLANMOBILE_VAPID_KONTAKT:-}
    volumes:
      - untplannext-mobile-daten:/data

  untplannext-mariadb:
    image: mariadb:11.4
    container_name: untplannext-mariadb
    profiles: ["mariadb"]
    restart: unless-stopped
    environment:
      TZ: ${ZEITZONE:-Europe/Berlin}
      MARIADB_DATABASE: untplanweb
      MARIADB_USER: untplanweb
      MARIADB_PASSWORD: ${MARIADB_PASSWORT:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORT:-}
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--max-allowed-packet=256M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - untplannext-mariadb-daten:/var/lib/mysql
      # legt beim ersten Start eines leeren Volumes zusätzlich die Datenbank eduorga_studio an (von install.sh erzeugt)
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    # MariaDB wird bewusst nicht von Watchtower aktualisiert (kein Label)

  untplannext-caddy:
    image: caddy:2
    container_name: untplannext-caddy
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - untplannext-caddy-daten:/data
      - untplannext-caddy-config:/config

  untplannext-watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: untplannext-watchtower
    profiles: ["updater"]
    restart: unless-stopped
    environment:
      TZ: ${ZEITZONE:-Europe/Berlin}
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:-}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCOPE: untplannext
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  untplannext-studio-daten:
    name: untplannext-studio-daten
  untplannext-web-daten:
  untplannext-mobile-daten:
    name: untplannext-mobile-daten
  untplannext-mariadb-daten:
  untplannext-caddy-daten:
    name: untplannext-caddy-daten
  untplannext-caddy-config:
