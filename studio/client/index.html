<!doctype html>
<html lang="de" data-thema="hell" data-modus="stundenplan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#164c55">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="EduOrga Studio – Stunden- und Vertretungsplanung im Browser. Einfach mehr Schulalltag.">
  <title>EduOrga Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Thema vor dem ersten Zeichnen setzen (kein weißes Aufblitzen im dunklen Thema)
    (function () {
      var t = 'hell';
      try { t = localStorage.getItem('studio.thema') || 'hell'; } catch (e) { /* privat */ }
      var d = t === 'dunkel' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.thema = t === 'auto' ? 'auto' : d ? 'dunkel' : 'hell';
      document.documentElement.style.background = d ? '#10161a' : '#f5f7f8';
      document.documentElement.style.colorScheme = d ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div id="app"><noscript>EduOrga Studio benötigt JavaScript.</noscript></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
